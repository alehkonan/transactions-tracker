[build]
command = "vite build"
publish = "dist/client"

[build.environment]
NODE_VERSION = "24"

# The custom Drizzle runner uses Netlify's branch-specific NETLIFY_DB_URL.
# Keep migrations outside netlify/database/migrations to avoid a second runner.
# Migrations run before publication; a later build failure does not undo them.
[context.production]
command = "pnpm db:migrate && vite build"

[context.deploy-preview]
command = "pnpm db:migrate && vite build"

[context.branch-deploy]
command = "pnpm db:migrate && vite build"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, immutable, max-age=31536000"

[[headers]]
for = "/_shell/*"
[headers.values]
Cache-Control = "public, immutable, max-age=31536000"
