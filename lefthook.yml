pre-commit:
  jobs:
    - name: format
      run: pnpm format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm lint:fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test:unit

    - name: knip
      run: pnpm knip
